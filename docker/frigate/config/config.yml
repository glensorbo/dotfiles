# Frigate NVR configuration
# Full reference: https://docs.frigate.video/configuration/
#
# This config targets a dual-NVIDIA-GPU host running the `tensorrt` Frigate image.
# GPU 0 handles: semantic search embeddings + face recognition
# GPU 1 handles: license plate recognition
# Both GPUs are available to the two ONNX object detectors (auto-assigned by Frigate).
#
# GenAI descriptions are generated via a local Ollama instance.
# Pull a vision-capable model before enabling, e.g.:
#   docker exec -it ollama ollama pull llava
#   docker exec -it ollama ollama pull minicpm-v  (lighter alternative)

# ---------------------------------------------------------------------------
# Object detectors
# Two ONNX detectors — in the tensorrt image, TensorRT is auto-detected and
# each detector process will acquire a GPU. With two detectors Frigate can
# handle more camera streams without frame-drop.
# ---------------------------------------------------------------------------
detectors:
  onnx_0:
    type: onnx
  onnx_1:
    type: onnx

# ---------------------------------------------------------------------------
# FFmpeg global defaults
# The NVIDIA CUVID preset enables hardware-accelerated decoding on the GPU.
# Override per-camera if some streams use H.265 (use preset-nvidia-h265).
# ---------------------------------------------------------------------------
ffmpeg:
  hwaccel_args: preset-nvidia-h264
  output_args:
    record: preset-record-generic-audio-copy

# ---------------------------------------------------------------------------
# Semantic search (Jina CLIP v1 — English, GPU-accelerated on device 0)
# Enables natural-language and image similarity search in the Explore view.
# The `large` model runs on GPU; `small` runs on CPU if GPU is unavailable.
# ---------------------------------------------------------------------------
semantic_search:
  enabled: true
  model: jinav1
  model_size: large
  device: 0  # target GPU 0

# ---------------------------------------------------------------------------
# Face recognition (ArcFace large model — GPU-accelerated on device 0)
# Recognised faces are added as sub-labels on person tracks.
# Train faces via Settings → Face Library in the Frigate UI.
# ---------------------------------------------------------------------------
face_recognition:
  enabled: true
  model_size: large
  device: 0  # target GPU 0
  recognition_threshold: 0.9
  unknown_score: 0.8
  blur_confidence_filter: true

# ---------------------------------------------------------------------------
# License plate recognition (YOLOv9 detector + PaddleOCR — GPU device 1)
# Recognised plates are added as sub-labels on car/motorcycle tracks.
# ---------------------------------------------------------------------------
lpr:
  enabled: true
  device: 1  # target GPU 1
  model_size: large

# ---------------------------------------------------------------------------
# Generative AI — object description via local Ollama
# Frigate sends tracked-object frames to Ollama at end-of-lifecycle and stores
# the generated description for semantic search and notifications.
#
# Requires a vision-capable model to be pulled in your Ollama instance, e.g.:
#   ollama pull llava
#   ollama pull minicpm-v
# ---------------------------------------------------------------------------
genai:
  enabled: true
  provider: ollama
  base_url: http://powerhouse.local.lan:11434
  model: llava  # change to whichever vision model you have pulled in Ollama

# ---------------------------------------------------------------------------
# Recording defaults (override per-camera as needed)
# ---------------------------------------------------------------------------
record:
  enabled: true
  retain:
    days: 7
    mode: motion   # only keep segments with motion (saves disk space)
  events:
    retain:
      default: 14  # days to keep event clips
      mode: active_objects

# ---------------------------------------------------------------------------
# Snapshot defaults
# ---------------------------------------------------------------------------
snapshots:
  enabled: true
  retain:
    default: 14  # days

# ---------------------------------------------------------------------------
# Birdseye (live multi-camera overview)
# ---------------------------------------------------------------------------
birdseye:
  enabled: true
  mode: objects  # show cameras only when objects are present

# ---------------------------------------------------------------------------
# go2rtc — WebRTC / RTSP restreaming
# Frigate embeds go2rtc; add your camera streams here to enable WebRTC live
# view and low-latency restreaming. See https://github.com/AlexxIT/go2rtc
# ---------------------------------------------------------------------------
go2rtc:
  streams:
    # Reolink PoE Doorbell — main stream (high-res, used for recording)
    # http-flv is the most reliable protocol for Reolink cameras.
    # The secondary `rtsp:` entry (without `ffmpeg:` prefix) is required for
    # two-way talk; go2rtc uses it to open the back-channel audio stream.
    doorbell:
      - "ffmpeg:http://{FRIGATE_DOORBELL_IP}/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_DOORBELL_USER}&password={FRIGATE_DOORBELL_PASSWORD}#video=copy#audio=copy#audio=opus"
      - "rtsp://{FRIGATE_DOORBELL_USER}:{FRIGATE_DOORBELL_PASSWORD}@{FRIGATE_DOORBELL_IP}/Preview_01_sub"

    # Sub-stream (low-res, used for detect — saves GPU/CPU on object detection)
    doorbell_sub:
      - "ffmpeg:http://{FRIGATE_DOORBELL_IP}/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_DOORBELL_USER}&password={FRIGATE_DOORBELL_PASSWORD}#video=copy#audio=opus"
      - "rtsp://{FRIGATE_DOORBELL_USER}:{FRIGATE_DOORBELL_PASSWORD}@{FRIGATE_DOORBELL_IP}/Preview_01_sub"

  # WebRTC candidates — required for low-latency two-way talk on the local network.
  # Set to the IP of the machine running Frigate (replace 192.168.x.x).
  webrtc:
    candidates:
      - 192.168.x.x:8555  # ← replace with your Frigate host IP
      - stun:8555

# ---------------------------------------------------------------------------
# MQTT (optional — required for Home Assistant integration)
# Uncomment and fill in if you have an MQTT broker.
# ---------------------------------------------------------------------------
# mqtt:
#   enabled: true
#   host: mqtt.local.lan
#   port: 1883
#   user: frigate
#   password: "{FRIGATE_MQTT_PASSWORD}"
#   topic_prefix: frigate
#   client_id: frigate

# ---------------------------------------------------------------------------
# Cameras
# Full camera reference: https://docs.frigate.video/configuration/cameras
# ---------------------------------------------------------------------------
cameras:
  # Reolink PoE Doorbell
  # Camera settings to configure in the Reolink app / web UI before deploying:
  #   - Video codec:      H.264 (avoid H.264+ / smart codec — strips keyframes)
  #   - Audio codec:      AAC
  #   - Interframe Space: 1x (matches i-frame interval to frame rate)
  #   - Fluency:          "On, fluency first" (enables CBR / constant bitrate)
  #   - HTTP:             Enable in Advanced Network settings (required for http-flv)
  #
  # Environment variables referenced here (set all in the Coolify UI):
  #   FRIGATE_DOORBELL_IP        — camera IP address, e.g. 192.168.1.50
  #   FRIGATE_DOORBELL_USER      — camera username
  #   FRIGATE_DOORBELL_PASSWORD  — camera password
  doorbell:
    ffmpeg:
      # Frigate reads both streams from the go2rtc restream (localhost:8554).
      # The main stream is used for recording; the sub-stream drives detection.
      inputs:
        - path: rtsp://127.0.0.1:8554/doorbell
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/doorbell_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
      output_args:
        record: preset-record-generic-audio-copy  # preserve AAC audio in recordings

    detect:
      enabled: true
      fps: 10
      # Resolution is auto-detected from the sub-stream; set explicitly if needed.
      # width: 896
      # height: 672

    objects:
      track:
        - person
        - package   # delivery detection
        - car
      genai:
        enabled: true
        # Tailored prompt for a doorbell context
        prompt: >
          Analyze the {label} captured by the {camera} doorbell camera.
          Focus on what the {label} is doing and their likely intent
          (e.g. approaching the door, leaving a package, walking past).
        object_prompts:
          person: >
            Describe what this person is doing at the front door.
            Are they ringing the bell, leaving a package, or just passing by?
            Note any items they are carrying.

    record:
      enabled: true

    snapshots:
      enabled: true

    # Allow live two-way talk from the Frigate UI (uses WebRTC back-channel)
    live:
      streams:
        Main: doorbell
        Sub: doorbell_sub
